# ============================================================
#  SaamBiz — site public et vitrines : config Nginx PROVISOIRE
#
#  À poser AVANT Certbot, le temps d'obtenir le certificat.
#  Remplacer : YOUR_DOMAIN par le domaine nu (ex: saambiz.com)
#
#    cp deploy/nginx-http.conf /etc/nginx/sites-available/saambiz-vitrine
#    sed -i "s/YOUR_DOMAIN/saambiz.com/g" /etc/nginx/sites-available/saambiz-vitrine
#    ln -sf /etc/nginx/sites-available/saambiz-vitrine /etc/nginx/sites-enabled/
#    nginx -t && systemctl reload nginx
#    certbot --nginx -d saambiz.com -d www.saambiz.com
#
#  Puis seulement, remplacer par deploy/nginx.conf.
#
#  Pourquoi deux fichiers : deploy/nginx.conf référence
#  /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem, qui n'existe pas tant que
#  Certbot n'est pas passé. Le poser trop tôt fait échouer `nginx -t` — et
#  comme un seul fichier invalide empêche de recharger TOUS les sites de la
#  machine, cela coupe aussi les autres domaines et le renouvellement des
#  certificats.
# ============================================================

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    # Validation ACME de Certbot (émission et renouvellement).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root  /var/www/saambiz-vitrine/dist;
    index index.html;

    # Application à page unique : /b/chez-fatou n'existe pas comme fichier sur
    # le disque. Sans try_files, le serveur répond 404 dès qu'un client ouvre
    # le lien d'une boutique reçu par WhatsApp — le cas normal, pas
    # l'exception.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
