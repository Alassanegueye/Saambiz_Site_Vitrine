# ============================================================
#  SaamBiz — site public et vitrines des boutiques (VPS Ubuntu)
#
#  Remplacer : YOUR_DOMAIN par le domaine nu (ex: saambiz.com)
#  Déposer dans : /etc/nginx/sites-available/saambiz-vitrine
#  Activer via  : ln -sf /etc/nginx/sites-available/saambiz-vitrine \
#                        /etc/nginx/sites-enabled/saambiz-vitrine
#
#  À POSER APRÈS CERTBOT. Les chemins /etc/letsencrypt/live/… n'existent
#  qu'une fois le certificat émis : utiliser deploy/nginx-http.conf pour le
#  premier passage.
#
#  Trois blocs : la redirection HTTP, la redirection de www vers le domaine
#  nu, et le site lui-même. Le site ne fait tourner aucun processus —
#  `npm run build` produit dist/, Nginx le sert tel quel.
# ============================================================

# ── HTTP → HTTPS, pour les deux noms ──────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://YOUR_DOMAIN$request_uri;
    }
}

# ── www → domaine nu ──────────────────────────────────────────────────────────
# Une seule origine canonique, et ce n'est pas une préférence esthétique : le
# `CORS_ORIGIN` du backend liste des origines exactes. Servir le site sous les
# deux noms obligerait à y déclarer les deux, et un oubli donne une erreur
# réseau sans message dans le navigateur — l'API refuse, le site affiche une
# page vide. `VITRINE_BASE_URL` du backend, qui construit les adresses de
# boutique partagées sur WhatsApp, vaut lui aussi le domaine nu.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.YOUR_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://YOUR_DOMAIN$request_uri;
}

# ── Le site ───────────────────────────────────────────────────────────────────
server {
    # `listen … http2` et non `http2 on;` : cette seconde forme, pourtant la
    # seule recommandée aujourd'hui, n'existe qu'à partir de Nginx 1.25.1 —
    # Ubuntu 22.04 et 24.04 livrent 1.24, où elle fait échouer `nginx -t` sur
    # « unknown directive "http2" ».
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name YOUR_DOMAIN;

    # ── Certificats Let's Encrypt (générés par Certbot) ──────────────────────
    #
    # L'include apporte le jeu TLS recommandé par Mozilla, tenu à jour par
    # Certbot. Ne pas redéclarer ssl_protocols ni ssl_prefer_server_ciphers
    # ici : Nginx refuse les doublons et `nginx -t` échouerait.
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── En-têtes de sécurité ─────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options    "nosniff"                                      always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"              always;

    root  /var/www/saambiz-vitrine/dist;
    index index.html;

    # ── Compression ──────────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 4;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        image/svg+xml
        application/manifest+json;

    # ── Ce qui n'est PAS une route du site ───────────────────────────────────
    # Les adresses d'API ne sont pas des routes React. Si elles retombaient sur
    # index.html, un appel mal configuré recevrait du HTML là où il attend du
    # JSON, et le site afficherait « Une erreur est survenue » au lieu de la
    # vraie panne. L'API vit sur api.YOUR_DOMAIN, jamais ici.
    location /saambiz/ {
        return 404;
    }

    # ── Routes de l'application ──────────────────────────────────────────────
    # /b/chez-fatou n'existe pas comme fichier : c'est une vitrine de boutique,
    # résolue côté client. Sans try_files, un client qui ouvre le lien reçu par
    # WhatsApp tombe sur un 404 — le cas normal, pas l'exception.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Cache ────────────────────────────────────────────────────────────────
    # Les fichiers de dist/assets portent une empreinte dans leur nom : un
    # contenu modifié change de nom, on peut donc les garder un an.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html est le seul point d'entrée à revalider. Sans cette exception,
    # un visiteur garderait indéfiniment les anciens noms de fichiers après un
    # déploiement, donc une page blanche jusqu'à vidage du cache.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/saambiz-vitrine-access.log combined;
    error_log  /var/log/nginx/saambiz-vitrine-error.log warn;
}
